<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inspo</title>
    <style>
      /* Orca injects its theme as --orca-* and sets a light/dark class on <html>; the --fb-* values
         are fallbacks for when those tokens are missing. */
      :root {
        --fb-bg: #141414; --fb-fg: #ededed; --fb-surface: #1e1e1e; --fb-muted: #9b9b9b; --fb-hairline: #2c2c2c;
      }
      html.light {
        --fb-bg: #ffffff; --fb-fg: #171717; --fb-surface: #f5f5f5; --fb-muted: #6b6b6b; --fb-hairline: #e5e5e5;
      }
      @media (prefers-color-scheme: light) {
        html:not(.dark) {
          --fb-bg: #ffffff; --fb-fg: #171717; --fb-surface: #f5f5f5; --fb-muted: #6b6b6b; --fb-hairline: #e5e5e5;
        }
      }
      :root {
        --bg: var(--orca-background, var(--fb-bg));
        --fg: var(--orca-foreground, var(--fb-fg));
        --surface: var(--orca-card, var(--fb-surface));
        --muted: var(--orca-muted-foreground, var(--fb-muted));
        --hairline: var(--orca-border, var(--fb-hairline));
        --dash: color-mix(in srgb, var(--fg) 22%, transparent);
        --stage: color-mix(in srgb, var(--bg) 70%, #000);
        --accent: #4c8dff;
        --accent-tint: rgba(76, 141, 255, 0.08);
        --scrim: color-mix(in srgb, var(--bg) 92%, transparent);
        --danger: var(--orca-destructive, #e5484d);
        --radius: 8px;
        color-scheme: dark light;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
      button:focus-visible, .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      svg { display: block; flex-shrink: 0; }
      .hidden { display: none !important; }

      /* Layout */
      #app { display: flex; flex-direction: column; height: 100%; padding: 12px; gap: 12px; position: relative; }
      .toolbar { display: flex; align-items: center; justify-content: space-between; height: 28px; flex-shrink: 0; }
      .title { display: flex; align-items: baseline; gap: 8px; }
      .title strong { font-size: 15px; font-weight: 600; }
      .count { color: var(--muted); }
      .icon-btn {
        display: inline-flex; align-items: center; justify-content: center;
        width: 28px; height: 28px; border-radius: 6px; color: var(--muted);
      }
      .icon-btn:hover { background: var(--surface); color: var(--fg); }
      .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; margin: 0 -12px; padding: 0 12px 12px; }

      /* Empty state */
      .dropzone {
        flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; padding: 24px; border: 1px dashed var(--dash); border-radius: 10px; text-align: center;
      }
      .dropzone h2 { margin: 0; font-size: 15px; font-weight: 600; }
      .dropzone p { margin: 6px 0 0; color: var(--muted); max-width: 240px; }
      .btn {
        display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 6px;
        background: var(--surface); border: 1px solid var(--hairline); font-weight: 500;
      }
      .btn:hover { border-color: var(--dash); }
      .formats { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); opacity: 0.8; }

      /* Pinned stage */
      .pinned { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--hairline); }
      .pinned-frame {
        position: relative; display: flex; align-items: center; justify-content: center;
        background: var(--stage); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--hairline);
      }
      .pinned-frame img { display: block; width: 100%; max-height: 46vh; object-fit: contain; cursor: zoom-in; }
      .pinned-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
      .pinned-name { display: flex; align-items: center; gap: 6px; min-width: 0; font-weight: 500; }
      .pinned-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .link-btn { color: var(--muted); font-size: 12px; flex-shrink: 0; }
      .link-btn:hover { color: var(--fg); }
      .section-label { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }

      /* Masonry grid */
      .grid { display: flex; gap: 8px; align-items: flex-start; }
      .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
      .add-tile {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
        height: 88px; border: 1px dashed var(--dash); border-radius: var(--radius); color: var(--muted); font-size: 12px;
      }
      .add-tile:hover { color: var(--fg); border-color: var(--muted); }
      .tile {
        position: relative; display: block; width: 100%; border-radius: var(--radius); overflow: hidden;
        background: var(--surface); border: 1px solid var(--hairline); cursor: zoom-in;
      }
      .tile img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .tile:hover { border-color: var(--muted); }
      .tile.is-pinned { border: 2px solid var(--accent); }
      .tile .actions { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; opacity: 0; transition: opacity 120ms; }
      .tile:hover .actions, .tile:focus-within .actions { opacity: 1; }
      .tile .actions button {
        display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px;
        border-radius: 6px; background: rgba(15, 15, 15, 0.85); color: #ededed;
      }
      .tile .actions button:hover { background: rgba(15, 15, 15, 1); }
      .tile .actions button.on { color: var(--accent); }
      .badge {
        position: absolute; left: 6px; top: 6px; height: 20px; padding: 0 7px; border-radius: 5px;
        display: inline-flex; align-items: center; background: var(--accent); color: #fff; font-size: 11px; font-weight: 600;
      }
      .tile.is-new { border-color: var(--accent); }
      .tile .caption {
        position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 8px 6px; font-size: 11px; color: #ededed;
        background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.75));
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity 120ms; text-align: left;
      }
      .tile:hover .caption, .tile:focus-visible .caption { opacity: 1; }

      /* Drag-over overlay */
      .drop-overlay {
        position: absolute; inset: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 6px; border: 1.5px solid var(--accent); border-radius: 10px; background: var(--accent-tint);
        backdrop-filter: blur(2px); pointer-events: none; text-align: center; z-index: 20;
      }
      .drop-overlay h2 { margin: 0; font-size: 15px; font-weight: 600; }
      .drop-overlay p { margin: 0; color: var(--muted); }
      .drop-overlay .solid { position: absolute; inset: 0; border-radius: 10px; background: var(--bg); z-index: -1; opacity: 0.88; }

      /* Lightbox */
      .lightbox {
        position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; padding: 12px;
        background: var(--scrim); backdrop-filter: blur(8px); z-index: 30;
      }
      .lb-top, .lb-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0; }
      .lb-top .group { display: flex; gap: 4px; }
      .lb-counter { color: var(--muted); }
      .lb-stage { position: relative; flex: 1; min-height: 0; overflow: auto; border-radius: var(--radius); display: grid; place-items: center; }
      .lb-stage img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; cursor: zoom-in; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45); }
      .lb-stage.actual { place-items: start; }
      .lb-stage.actual img { max-width: none; max-height: none; cursor: zoom-out; border-radius: 0; }
      .nav-btn {
        position: absolute; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 16px;
        display: inline-flex; align-items: center; justify-content: center; background: rgba(15, 15, 15, 0.85); color: #ededed; z-index: 2;
      }
      .nav-btn.prev { left: 8px; } .nav-btn.next { right: 8px; }
      .nav-btn:disabled { opacity: 0.3; cursor: default; }
      .lb-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .lb-sub { color: var(--muted); font-size: 12px; }
      .lb-meta { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
      .lb-actions { display: flex; gap: 4px; flex-shrink: 0; }
      .square-btn {
        display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px;
        border-radius: 6px; border: 1px solid var(--hairline); color: var(--muted);
      }
      .square-btn:hover { color: var(--fg); background: var(--surface); }
      .square-btn.on { color: var(--accent); border-color: var(--accent); }
      .square-btn.danger:hover { color: var(--danger); }

      /* Toast */
      .toast {
        position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; align-items: center; justify-content: space-between;
        gap: 8px; padding: 8px 8px 8px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--hairline);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35); z-index: 40;
      }
      .toast button { color: var(--accent); font-weight: 600; padding: 4px 6px; border-radius: 4px; }
      .notice { padding: 8px 10px; border-radius: 6px; background: var(--surface); color: var(--muted); font-size: 12px; flex-shrink: 0; }
    </style>
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <div class="title"><strong>Inspo</strong><span class="count" id="count"></span></div>
        <button class="icon-btn" id="addBtn" aria-label="Add screenshots" title="Add screenshots">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </header>

      <div class="notice hidden" id="notice" role="status"></div>

      <section class="dropzone hidden" id="empty">
        <svg width="56" height="48" viewBox="0 0 56 48" fill="none" aria-hidden="true">
          <rect x="14" y="2" width="38" height="28" rx="4" transform="rotate(8 14 2)" fill="var(--surface)" stroke="var(--dash)"/>
          <rect x="4" y="12" width="38" height="28" rx="4" fill="var(--surface)" stroke="var(--muted)" stroke-opacity="0.6"/>
          <circle cx="14" cy="21" r="3" fill="var(--muted)" fill-opacity="0.6"/>
          <path d="M4 34l11-9 8 6 6-4 13 9" stroke="var(--muted)" stroke-opacity="0.6" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        <div>
          <h2>Drop screenshots here</h2>
          <p>Keep references beside your work while you build.</p>
        </div>
        <button class="btn" id="browseBtn">Browse files</button>
        <span class="formats">PNG · JPG · WebP · GIF</span>
      </section>

      <div class="scroll hidden" id="board">
        <section class="pinned hidden" id="pinned" aria-label="Pinned screenshot">
          <div class="pinned-frame"><img id="pinnedImg" alt="" /></div>
          <div class="pinned-meta">
            <div class="pinned-name">
              <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 2l4 4-3 1-3 3 .5 3.5L2.5 7.5 6 8l3-3 1-3zM5 11l-3 3" stroke="var(--accent)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span id="pinnedName"></span>
            </div>
            <button class="link-btn" id="unpinBtn">Unpin</button>
          </div>
        </section>
        <div class="section-label hidden" id="gridLabel">All screenshots</div>
        <div class="grid" id="grid"></div>
      </div>

      <div class="drop-overlay hidden" id="dropOverlay" aria-hidden="true">
        <div class="solid"></div>
        <h2 id="dropTitle">Drop to add</h2>
        <p>They’ll show up on your board instantly.</p>
      </div>

      <div class="lightbox hidden" id="lightbox" role="dialog" aria-modal="true" aria-label="Screenshot viewer">
        <div class="lb-top">
          <span class="lb-counter" id="lbCounter"></span>
          <div class="group">
            <button class="icon-btn" id="lbClose" aria-label="Close viewer" title="Close (Esc)">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>
        <div class="lb-stage" id="lbStage">
          <button class="nav-btn prev" id="lbPrev" aria-label="Previous screenshot">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <img id="lbImg" alt="" />
          <button class="nav-btn next" id="lbNext" aria-label="Next screenshot">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="lb-bottom">
          <div class="lb-meta">
            <span class="lb-name" id="lbName"></span>
            <span class="lb-sub" id="lbSub"></span>
          </div>
          <div class="lb-actions">
            <button class="square-btn" id="lbPin" aria-label="Pin to top" title="Pin to top">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 2l4 4-3 1-3 3 .5 3.5L2.5 7.5 6 8l3-3 1-3zM5 11l-3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="square-btn danger" id="lbDelete" aria-label="Remove screenshot" title="Remove">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="toast hidden" id="toast" role="status" aria-live="polite">
        <span id="toastText"></span>
        <button id="toastAction" class="hidden">Undo</button>
      </div>

      <input type="file" id="fileInput" accept="image/*" multiple hidden />
    </div>

    <script>
      'use strict'
      ;(() => {
        const PIN_ICON = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 2l4 4-3 1-3 3 .5 3.5L2.5 7.5 6 8l3-3 1-3zM5 11l-3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        const TRASH_ICON = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        const THUMB_WIDTH = 640
        const NEW_BADGE_MS = 4000
        const UNDO_MS = 6000
        const MAX_FILE_BYTES = 40 * 1024 * 1024

        const $ = (id) => document.getElementById(id)
        const els = {
          count: $('count'), notice: $('notice'), empty: $('empty'), board: $('board'), grid: $('grid'),
          gridLabel: $('gridLabel'), pinned: $('pinned'), pinnedImg: $('pinnedImg'), pinnedName: $('pinnedName'),
          dropOverlay: $('dropOverlay'), dropTitle: $('dropTitle'), lightbox: $('lightbox'), lbStage: $('lbStage'),
          lbImg: $('lbImg'), lbCounter: $('lbCounter'), lbName: $('lbName'), lbSub: $('lbSub'), lbPin: $('lbPin'),
          lbPrev: $('lbPrev'), lbNext: $('lbNext'), toast: $('toast'), toastText: $('toastText'),
          toastAction: $('toastAction'), fileInput: $('fileInput')
        }

        // ---------- Storage: IndexedDB in the plugin's own partition, memory if unavailable ----------
        const DB_NAME = 'inspo-board'
        const DB_VERSION = 1
        let dbPromise = null

        function openDb() {
          if (dbPromise) return dbPromise
          dbPromise = new Promise((resolve) => {
            let request
            try {
              request = indexedDB.open(DB_NAME, DB_VERSION)
            } catch {
              resolve(null)
              return
            }
            request.onupgradeneeded = () => {
              const db = request.result
              if (!db.objectStoreNames.contains('shots')) db.createObjectStore('shots', { keyPath: 'id' })
              if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta')
            }
            request.onsuccess = () => resolve(request.result)
            request.onerror = () => resolve(null)
            request.onblocked = () => resolve(null)
          })
          return dbPromise
        }

        function tx(db, store, mode, run) {
          return new Promise((resolve, reject) => {
            const t = db.transaction(store, mode)
            const result = run(t.objectStore(store))
            t.oncomplete = () => resolve(result && 'result' in result ? result.result : undefined)
            t.onerror = () => reject(t.error)
            t.onabort = () => reject(t.error)
          })
        }

        const store = {
          persistent: false,
          async loadAll() {
            const db = await openDb()
            this.persistent = Boolean(db)
            if (!db) return { shots: [], pinnedId: null }
            const shots = (await tx(db, 'shots', 'readonly', (s) => s.getAll())) || []
            const pinnedId = (await tx(db, 'meta', 'readonly', (s) => s.get('pinnedId'))) ?? null
            return { shots, pinnedId }
          },
          async put(shot) {
            const db = await openDb()
            if (db) await tx(db, 'shots', 'readwrite', (s) => s.put(shot))
          },
          async remove(id) {
            const db = await openDb()
            if (db) await tx(db, 'shots', 'readwrite', (s) => s.delete(id))
          },
          async setPinned(id) {
            const db = await openDb()
            if (db) await tx(db, 'meta', 'readwrite', (s) => (id ? s.put(id, 'pinnedId') : s.delete('pinnedId')))
          }
        }

        // ---------- State ----------
        const state = {
          shots: [], // newest first: { id, name, type, addedAt, w, h, blob, thumb }
          pinnedId: null,
          newIds: new Set(),
          viewerIndex: -1
        }
        const urlCache = new Map() // key -> data: URL (data: works in every Orca frame; blob: only on desktop)

        function readAsDataUrl(blob) {
          return new Promise((resolve, reject) => {
            const reader = new FileReader()
            reader.onload = () => resolve(reader.result)
            reader.onerror = () => reject(reader.error)
            reader.readAsDataURL(blob)
          })
        }

        async function urlFor(shot, kind) {
          const key = shot.id + ':' + kind
          if (!urlCache.has(key)) urlCache.set(key, readAsDataUrl(kind === 'thumb' ? shot.thumb : shot.blob))
          return urlCache.get(key)
        }

        function dropUrls(id) {
          urlCache.delete(id + ':thumb')
          urlCache.delete(id + ':full')
        }

        // ---------- Adding files ----------
        function isImage(file) {
          return file && typeof file.type === 'string' && file.type.startsWith('image/')
        }

        async function decode(file) {
          if (typeof createImageBitmap === 'function') {
            try { return await createImageBitmap(file) } catch { /* fall through to <img> */ }
          }
          const url = await readAsDataUrl(file)
          return await new Promise((resolve, reject) => {
            const img = new Image()
            img.onload = () => resolve(img)
            img.onerror = () => reject(new Error('decode'))
            img.src = url
          })
        }

        async function makeThumb(source, w, h) {
          if (w <= THUMB_WIDTH) return null
          const canvas = document.createElement('canvas')
          canvas.width = THUMB_WIDTH
          canvas.height = Math.max(1, Math.round((h / w) * THUMB_WIDTH))
          const ctx = canvas.getContext('2d')
          ctx.imageSmoothingQuality = 'high'
          ctx.drawImage(source, 0, 0, canvas.width, canvas.height)
          return await new Promise((resolve) => canvas.toBlob((b) => resolve(b), 'image/webp', 0.86))
        }

        function newId() {
          return (crypto.randomUUID && crypto.randomUUID()) || String(Date.now()) + Math.random().toString(16).slice(2)
        }

        async function addFiles(fileList) {
          const files = Array.from(fileList || [])
          const images = files.filter(isImage)
          const skipped = files.length - images.length
          let added = 0
          let failed = 0
          let tooBig = 0
          for (const file of images) {
            if (file.size > MAX_FILE_BYTES) { tooBig++; continue }
            try {
              const bitmap = await decode(file)
              const w = bitmap.width || bitmap.naturalWidth
              const h = bitmap.height || bitmap.naturalHeight
              const thumb = await makeThumb(bitmap, w, h)
              if (bitmap.close) bitmap.close()
              const shot = {
                id: newId(),
                name: file.name || 'Pasted image.png',
                type: file.type,
                addedAt: Date.now(),
                w, h,
                blob: file.slice(0, file.size, file.type),
                thumb: thumb || file.slice(0, file.size, file.type)
              }
              await store.put(shot)
              state.shots.unshift(shot)
              state.newIds.add(shot.id)
              setTimeout(() => { state.newIds.delete(shot.id); render() }, NEW_BADGE_MS)
              added++
              render()
            } catch (error) {
              if (error && error.name === 'QuotaExceededError') {
                showToast('Out of space. Remove a few screenshots and try again.')
                return
              }
              failed++
            }
          }
          const problems = []
          if (skipped) problems.push(skipped + (skipped === 1 ? ' file isn’t an image' : ' files aren’t images'))
          if (failed) problems.push(failed + ' couldn’t be read')
          if (tooBig) problems.push(tooBig + ' over 40 MB')
          if (problems.length) showToast((added ? 'Added ' + added + '. ' : '') + problems.join(', ') + '.')
        }

        // ---------- Rendering ----------
        function relTime(ts) {
          const s = Math.round((Date.now() - ts) / 1000)
          if (s < 45) return 'just now'
          const m = Math.round(s / 60)
          if (m < 60) return m + 'm ago'
          const hr = Math.round(m / 60)
          if (hr < 24) return hr + 'h ago'
          return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
        }

        function setImg(img, shot, kind) {
          img.dataset.for = shot.id + ':' + kind
          urlFor(shot, kind).then((url) => {
            if (img.dataset.for === shot.id + ':' + kind) img.src = url
          }).catch(() => { img.alt = 'Couldn’t load ' + shot.name })
        }

        function columnCount() {
          return els.board.clientWidth < 240 ? 1 : 2
        }

        function render() {
          const n = state.shots.length
          els.count.textContent = n ? String(n) : ''
          els.empty.classList.toggle('hidden', n > 0)
          els.board.classList.toggle('hidden', n === 0)
          if (!store.persistent && n > 0) {
            els.notice.textContent = 'This Orca can’t save screenshots here, so they’ll clear when the panel closes.'
            els.notice.classList.remove('hidden')
          } else {
            els.notice.classList.add('hidden')
          }
          if (!n) return

          // Pinned stage
          const pinned = state.shots.find((s) => s.id === state.pinnedId)
          els.pinned.classList.toggle('hidden', !pinned)
          els.gridLabel.classList.toggle('hidden', !pinned)
          if (pinned) {
            setImg(els.pinnedImg, pinned, 'full')
            els.pinnedImg.alt = pinned.name
            els.pinnedName.textContent = pinned.name
            els.pinnedImg.onclick = () => openViewer(state.shots.indexOf(pinned))
          }

          // Masonry: place each tile in the shorter column, keeping newest-first reading order
          const cols = columnCount()
          const colWidth = Math.max(1, (els.board.clientWidth - 24 - 8 * (cols - 1)) / cols)
          const columns = []
          const heights = []
          for (let i = 0; i < cols; i++) {
            const col = document.createElement('div')
            col.className = 'col'
            columns.push(col)
            heights.push(0)
          }
          const add = document.createElement('button')
          add.className = 'add-tile'
          add.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Drop or browse</span>'
          add.addEventListener('click', pickFiles)
          columns[0].appendChild(add)
          heights[0] = 88 + 8

          state.shots.forEach((shot, index) => {
            const tileHeight = Math.min(colWidth * 1.8, Math.max(colWidth * 0.5, colWidth * (shot.h / shot.w)))
            const target = heights.indexOf(Math.min(...heights))
            heights[target] += tileHeight + 8

            const tile = document.createElement('div')
            tile.className = 'tile'
            tile.tabIndex = 0
            tile.setAttribute('role', 'button')
            tile.setAttribute('aria-label', 'Open ' + shot.name)
            tile.style.height = Math.round(tileHeight) + 'px'
            if (shot.id === state.pinnedId) tile.classList.add('is-pinned')
            if (state.newIds.has(shot.id)) tile.classList.add('is-new')

            const img = document.createElement('img')
            img.alt = ''
            img.loading = 'lazy'
            setImg(img, shot, 'thumb')
            tile.appendChild(img)

            if (state.newIds.has(shot.id)) {
              const badge = document.createElement('span')
              badge.className = 'badge'
              badge.textContent = 'New'
              tile.appendChild(badge)
            }

            const caption = document.createElement('span')
            caption.className = 'caption'
            caption.textContent = shot.name
            tile.appendChild(caption)

            const actions = document.createElement('div')
            actions.className = 'actions'
            const pinBtn = document.createElement('button')
            const isPinned = shot.id === state.pinnedId
            pinBtn.innerHTML = PIN_ICON
            pinBtn.className = isPinned ? 'on' : ''
            pinBtn.setAttribute('aria-label', isPinned ? 'Unpin' : 'Pin to top')
            pinBtn.title = isPinned ? 'Unpin' : 'Pin to top'
            pinBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePin(shot.id) })
            const delBtn = document.createElement('button')
            delBtn.innerHTML = TRASH_ICON
            delBtn.setAttribute('aria-label', 'Remove ' + shot.name)
            delBtn.title = 'Remove'
            delBtn.addEventListener('click', (e) => { e.stopPropagation(); removeShot(shot.id) })
            actions.append(pinBtn, delBtn)
            tile.appendChild(actions)

            tile.addEventListener('click', () => openViewer(index))
            tile.addEventListener('keydown', (e) => {
              if (e.target !== tile) return
              if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openViewer(index) }
            })
            columns[target].appendChild(tile)
          })
          els.grid.replaceChildren(...columns)
          if (state.viewerIndex >= 0) renderViewer()
        }

        // ---------- Pin / remove ----------
        async function togglePin(id) {
          state.pinnedId = state.pinnedId === id ? null : id
          render()
          try { await store.setPinned(state.pinnedId) } catch { showToast('Couldn’t save the pin.') }
          if (state.pinnedId) els.board.scrollTo({ top: 0, behavior: 'smooth' })
        }

        async function removeShot(id) {
          const index = state.shots.findIndex((s) => s.id === id)
          if (index < 0) return
          const [shot] = state.shots.splice(index, 1)
          const wasPinned = state.pinnedId === id
          if (wasPinned) state.pinnedId = null
          if (state.viewerIndex >= 0) {
            if (!state.shots.length) closeViewer()
            else state.viewerIndex = Math.min(index, state.shots.length - 1)
          }
          render()
          try {
            await store.remove(id)
            if (wasPinned) await store.setPinned(null)
          } catch { /* the record stays until next delete; nothing to show */ }
          dropUrls(id)
          showToast('Removed ' + shot.name, 'Undo', async () => {
            const restoredAt = Math.min(index, state.shots.length)
            state.shots.splice(restoredAt, 0, shot)
            if (wasPinned) state.pinnedId = shot.id
            if (state.viewerIndex >= 0) state.viewerIndex = restoredAt
            render()
            try {
              await store.put(shot)
              if (wasPinned) await store.setPinned(shot.id)
            } catch {
              showToast('Couldn’t restore ' + shot.name + '.')
            }
          })
        }

        // ---------- Viewer (lightbox) ----------
        let lastFocus = null
        function openViewer(index) {
          if (index < 0) return
          lastFocus = document.activeElement
          state.viewerIndex = index
          els.lbStage.classList.remove('actual')
          els.lightbox.classList.remove('hidden')
          renderViewer()
          $('lbClose').focus()
        }
        function closeViewer() {
          state.viewerIndex = -1
          els.lightbox.classList.add('hidden')
          if (lastFocus && lastFocus.isConnected) lastFocus.focus()
        }
        function step(delta) {
          const next = state.viewerIndex + delta
          if (next < 0 || next >= state.shots.length) return
          state.viewerIndex = next
          els.lbStage.classList.remove('actual')
          renderViewer()
        }
        function renderViewer() {
          const shot = state.shots[state.viewerIndex]
          if (!shot) return closeViewer()
          setImg(els.lbImg, shot, 'full')
          els.lbImg.alt = shot.name
          els.lbCounter.textContent = (state.viewerIndex + 1) + ' of ' + state.shots.length
          els.lbName.textContent = shot.name
          els.lbSub.textContent = 'Added ' + relTime(shot.addedAt) + ' · ' + shot.w + '×' + shot.h + ' · click to zoom'
          els.lbPrev.disabled = state.viewerIndex === 0
          els.lbNext.disabled = state.viewerIndex === state.shots.length - 1
          const pinned = shot.id === state.pinnedId
          els.lbPin.classList.toggle('on', pinned)
          els.lbPin.setAttribute('aria-label', pinned ? 'Unpin' : 'Pin to top')
          els.lbPin.title = pinned ? 'Unpin' : 'Pin to top'
        }

        // ---------- Toast ----------
        let toastTimer = null
        function showToast(text, actionLabel, onAction) {
          clearTimeout(toastTimer)
          els.toastText.textContent = text
          els.toastAction.classList.toggle('hidden', !actionLabel)
          els.toastAction.textContent = actionLabel || ''
          els.toastAction.onclick = onAction ? () => { hideToast(); onAction() } : null
          els.toast.classList.remove('hidden')
          toastTimer = setTimeout(hideToast, actionLabel ? UNDO_MS : 4000)
        }
        function hideToast() {
          els.toast.classList.add('hidden')
          els.toastAction.onclick = null
        }

        // ---------- Input: browse, drag and drop, paste ----------
        function pickFiles() { els.fileInput.click() }
        $('addBtn').addEventListener('click', pickFiles)
        $('browseBtn').addEventListener('click', pickFiles)
        els.fileInput.addEventListener('change', () => {
          addFiles(els.fileInput.files)
          els.fileInput.value = ''
        })

        const hasFiles = (e) => Array.from((e.dataTransfer && e.dataTransfer.types) || []).includes('Files')
        let dragDepth = 0
        function fileCount(e) {
          const items = Array.from((e.dataTransfer && e.dataTransfer.items) || []).filter((i) => i.kind === 'file')
          return items.length
        }
        document.addEventListener('dragenter', (e) => {
          if (!hasFiles(e)) return
          e.preventDefault()
          dragDepth++
          const n = fileCount(e)
          els.dropTitle.textContent = n > 1 ? 'Drop to add ' + n + ' screenshots' : 'Drop to add'
          els.dropOverlay.classList.remove('hidden')
        })
        document.addEventListener('dragover', (e) => {
          if (!hasFiles(e)) return
          e.preventDefault()
          e.dataTransfer.dropEffect = 'copy'
        })
        document.addEventListener('dragleave', (e) => {
          if (!hasFiles(e)) return
          dragDepth = Math.max(0, dragDepth - 1)
          if (dragDepth === 0) els.dropOverlay.classList.add('hidden')
        })
        document.addEventListener('drop', (e) => {
          if (!hasFiles(e)) return
          e.preventDefault()
          dragDepth = 0
          els.dropOverlay.classList.add('hidden')
          addFiles(e.dataTransfer.files)
        })
        document.addEventListener('paste', (e) => {
          const files = Array.from((e.clipboardData && e.clipboardData.files) || [])
          if (files.length) { e.preventDefault(); addFiles(files) }
        })

        // ---------- Viewer controls and keys ----------
        $('lbClose').addEventListener('click', closeViewer)
        els.lbPrev.addEventListener('click', () => step(-1))
        els.lbNext.addEventListener('click', () => step(1))
        els.lbPin.addEventListener('click', () => {
          const shot = state.shots[state.viewerIndex]
          if (shot) togglePin(shot.id)
        })
        $('lbDelete').addEventListener('click', () => {
          const shot = state.shots[state.viewerIndex]
          if (shot) removeShot(shot.id)
        })
        els.lbImg.addEventListener('click', () => els.lbStage.classList.toggle('actual'))
        $('unpinBtn').addEventListener('click', () => togglePin(state.pinnedId))
        document.addEventListener('keydown', (e) => {
          if (state.viewerIndex < 0) return
          if (e.key === 'Escape') { e.preventDefault(); closeViewer() }
          else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1) }
          else if (e.key === 'ArrowRight') { e.preventDefault(); step(1) }
        })

        // Re-flow the masonry when the sidebar is resized
        let resizeTimer = null
        new ResizeObserver(() => {
          clearTimeout(resizeTimer)
          resizeTimer = setTimeout(() => { if (state.shots.length) render() }, 80)
        }).observe(document.body)

        // ---------- Boot ----------
        store.loadAll().then(({ shots, pinnedId }) => {
          state.shots = shots.sort((a, b) => b.addedAt - a.addedAt)
          state.pinnedId = shots.some((s) => s.id === pinnedId) ? pinnedId : null
          render()
        }).catch(() => {
          store.persistent = false
          render()
          showToast('Couldn’t open your saved screenshots.')
        })
      })()
    </script>
  </body>
</html>
